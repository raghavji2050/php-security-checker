name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
        env:
          # Official NVD snapshot only; the live NVD API is not called in CI e2e.
          NVD_FIXTURE: e2e/fixtures/nvd-php-runtime.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
